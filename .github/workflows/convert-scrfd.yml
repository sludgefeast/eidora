name: Convert SCRFD to TFLite

# Downloads the SCRFD_2.5G_KPS ONNX (InsightFace weights, non-commercial
# license – private use only), converts it to TFLite with a fixed 640x640
# input via onnx2tf, and publishes it as release "models-v2".
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install onnx2tf and dependencies
        run: |
          pip install --no-cache-dir \
            "tensorflow==2.17.0" \
            "tf_keras" \
            "onnx==1.16.1" \
            "onnxruntime==1.18.1" \
            "onnx2tf==1.26.3" \
            "onnx_graphsurgeon" \
            "sng4onnx" \
            "onnxsim==0.4.36" \
            "psutil" \
            "ml_dtypes" \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - << 'PYEOF'
          import numpy as np, os, site
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          targets = [
              name,
              os.path.join(site.getsitepackages()[0], "onnx2tf", name),
              os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name),
          ]
          for t in targets:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
              print("wrote", t)
          PYEOF

      - name: Download SCRFD_2.5G_KPS ONNX
        run: |
          curl -L -o det_2.5g.onnx \
            https://github.com/Kumar2421/scrfd_arcface_facerecognition/raw/main/weights/det_2.5g.onnx
          ls -la det_2.5g.onnx
          sha256sum det_2.5g.onnx
          # Sanity check: a valid ONNX is several MB; an LFS pointer is ~130 bytes
          SIZE=$(stat -c%s det_2.5g.onnx)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloaded file too small ($SIZE bytes) – possibly a Git-LFS pointer. Aborting."
            head -c 300 det_2.5g.onnx
            exit 1
          fi

      - name: Convert to TFLite (fixed 640x640)
        run: |
          onnx2tf -i det_2.5g.onnx \
            -ois input.1:1,3,640,640 \
            -o scrfd_saved_model || \
          onnx2tf -i det_2.5g.onnx \
            -ois images:1,3,640,640 \
            -o scrfd_saved_model
          ls -la scrfd_saved_model/

      - name: Collect and rename output
        run: |
          cp scrfd_saved_model/*_float32.tflite scrfd_2.5g_kps_640_float32.tflite
          sha256sum scrfd_2.5g_kps_640_float32.tflite > checksums.txt
          cat checksums.txt

      - name: Create release with model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v2
          name: "Model assets v2 (SCRFD)"
          body: |
            SCRFD_2.5G_KPS face detection model converted from InsightFace
            ONNX weights to TFLite with fixed 640x640 input via onnx2tf.

            NOTE: The InsightFace model weights are licensed for
            non-commercial research use only. Private use only –
            do not redistribute publicly.

            See checksums.txt for SHA-256.
          files: |
            scrfd_2.5g_kps_640_float32.tflite
            checksums.txt
