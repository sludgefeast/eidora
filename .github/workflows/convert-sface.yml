name: Convert SFace to TFLite

# Downloads the OpenCV SFace ONNX (MobileFaceNet backbone, SFace loss;
# Apache-2.0 weights from the OpenCV Zoo), inspects its input/output shape,
# converts it to TFLite with a fixed 112x112 input via onnx2tf, and publishes
# it as release "models-free-v1".
#
# Unlike the ArcFace weights, SFace is Apache-2.0 and may be redistributed —
# so this model is the F-Droid-friendly default embedding option.
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install onnx2tf and dependencies
        run: |
          pip install --no-cache-dir \
            "tensorflow==2.17.0" \
            "tf_keras" \
            "onnx==1.16.1" \
            "onnxruntime==1.18.1" \
            "onnx2tf==1.26.3" \
            "onnx_graphsurgeon" \
            "sng4onnx" \
            "onnxsim==0.4.36" \
            "psutil" \
            "ml_dtypes" \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - << 'PYEOF'
          import numpy as np, os, site
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          targets = [
              name,
              os.path.join(site.getsitepackages()[0], "onnx2tf", name),
              os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name),
          ]
          for t in targets:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
              print("wrote", t)
          PYEOF

      - name: Download SFace ONNX (Apache-2.0, OpenCV Zoo)
        run: |
          curl -L -o sface.onnx \
            https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec.onnx
          ls -la sface.onnx
          echo "--- checksum ---"
          sha256sum sface.onnx
          # Integrity check against the known OpenCV Zoo release hash.
          EXPECTED="0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
          ACTUAL=$(sha256sum sface.onnx | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SFace ONNX hash mismatch. Expected $EXPECTED, got $ACTUAL"
            echo "The upstream file changed — verify the source before trusting the output."
            exit 1
          fi
          echo "ONNX hash verified."

      - name: Inspect ONNX input/output (resolves dim + input name)
        run: |
          python - << 'PYEOF'
          import onnx
          m = onnx.load("sface.onnx")
          g = m.graph
          def shape_of(vi):
              dims = []
              for d in vi.type.tensor_type.shape.dim:
                  dims.append(d.dim_value if d.dim_value > 0 else d.dim_param or "?")
              return dims
          print("=== INPUTS ===")
          for i in g.input:
              print(f"  name={i.name!r} shape={shape_of(i)}")
          print("=== OUTPUTS ===")
          for o in g.output:
              print(f"  name={o.name!r} shape={shape_of(o)}")
          # Persist the first input name for the conversion step.
          with open("input_name.txt", "w") as f:
              f.write(g.input[0].name)
          # Persist the embedding dimension (last dim of the first output).
          out_dims = shape_of(g.output[0])
          emb = out_dims[-1] if out_dims else "?"
          print(f"\nEMBEDDING_DIM (from ONNX output) = {emb}")
          print("^ Put this value into EmbeddingModelSpec.SFACE_FREE.embeddingDim")
          PYEOF

      - name: Convert to TFLite (fixed 112x112)
        run: |
          INPUT_NAME=$(cat input_name.txt)
          echo "Using input tensor name: $INPUT_NAME"
          onnx2tf -i sface.onnx \
            -ois "${INPUT_NAME}:1,3,112,112" \
            -o sface_saved_model
          ls -la sface_saved_model/

      - name: Collect and rename output
        run: |
          cp sface_saved_model/*_float32.tflite sface_opencv_float32.tflite
          echo "--- final TFLite ---"
          ls -la sface_opencv_float32.tflite
          sha256sum sface_opencv_float32.tflite > checksums.txt
          cat checksums.txt
          echo ""
          echo "::notice::Put this SHA-256 into ModelDownloader's SFACE_FREE entry."

      - name: Create release with model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-free-v1
          name: "Model assets free-v1 (SFace)"
          body: |
            OpenCV SFace (MobileFaceNet backbone, SFace loss) face embedding
            model, converted from the OpenCV Zoo ONNX to TFLite with a fixed
            112x112 input via onnx2tf.

            License: Apache-2.0 (weights included) — redistributable, and the
            F-Droid-friendly default embedding model for Eidora.

            Source ONNX:
            https://huggingface.co/opencv/face_recognition_sface
            (face_recognition_sface_2021dec.onnx,
             sha256 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79)

            After publishing, update in the app:
              - EmbeddingModelSpec.SFACE_FREE.embeddingDim (see the conversion
                log's "EMBEDDING_DIM (from ONNX output)" line)
              - ModelDownloader SFACE_FREE url + sha256 (see checksums.txt)
              - verify the input normalization against the ONNX graph

            See checksums.txt for the TFLite SHA-256.
          files: |
            sface_opencv_float32.tflite
            checksums.txt
