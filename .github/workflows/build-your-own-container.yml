name: Build your own model container

# Generic "bring your own model" builder. It does NOT reference or fetch any
# specific model — you supply a manifest whose models carry `build:` metadata
# (onnx_url, input_name, size), and it builds the container from that. The
# result is uploaded as a workflow *artifact* (downloadable only by you), never
# published as a release.
#
# This exists so you can convert models whose licence doesn't allow us to host
# them (e.g. research-only face models) without those models or their sources
# ever appearing in this repository. What you build here, and whether its
# licence permits your use, is your responsibility.
#
# Same conversion core as the free-model workflow: both call
# scripts/build_container.py, which reads the manifest, converts each model with
# scripts/convert_model.py, and packs with scripts/pack_container.py.
#
# GitHub Actions can't take file uploads through workflow_dispatch, only text,
# so the manifest is given as a URL. The ONNX URLs live inside the manifest's
# `build:` blocks. Put the manifest somewhere the runner can reach (a gist,
# your own storage, or a raw link to a manifest in your repo).
on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "URL to your manifest.yml (its models need build: metadata)"
        required: true
      container_name:
        description: "Output container filename (without extension)"
        required: true
        default: "my-model"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (for the build scripts)
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install conversion + packing deps
        run: |
          pip install \
            "tensorflow==2.17.0" tf_keras "onnx==1.16.1" \
            "onnxruntime==1.18.1" "onnx2tf==1.26.3" onnx_graphsurgeon \
            sng4onnx "onnxsim==0.4.36" psutil ml_dtypes pyyaml \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - <<'PY'
          import os, site
          import numpy as np
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          for t in [name,
                    os.path.join(site.getsitepackages()[0], "onnx2tf", name),
                    os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name)]:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
          PY

      - name: Fetch manifest
        run: |
          curl -fL -o byo-manifest.yml "${{ inputs.manifest_url }}"
          echo "--- manifest ---"
          cat byo-manifest.yml

      - name: Build container
        run: |
          python scripts/build_container.py \
            --manifest byo-manifest.yml \
            --out "${{ inputs.container_name }}.eidoramodel"
          echo "--- container ---"
          sha256sum "${{ inputs.container_name }}.eidoramodel"

      - name: Upload container as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.container_name }}
          path: ${{ inputs.container_name }}.eidoramodel
          retention-days: 7
          if-no-files-found: error
