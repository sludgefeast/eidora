name: Convert YuNet to TFLite

# Manually triggered. Downloads the official YuNet ONNX from OpenCV Zoo,
# converts it to TFLite with a fixed 640x640 input using onnx2tf, and
# publishes the result as a GitHub release ("models-v1").
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # needed to create the release
    steps:
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install onnx2tf and dependencies
        run: |
          pip install --no-cache-dir \
            "tensorflow==2.17.0" \
            "tf_keras" \
            "onnx==1.16.1" \
            "onnxruntime==1.18.1" \
            "onnx2tf==1.26.3" \
            "onnx_graphsurgeon" \
            "sng4onnx" \
            "onnxsim==0.4.36" \
            "psutil" \
            "ml_dtypes" \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          # Find where onnx2tf expects its test/calibration npy file
          grep -rn "calibration_image_sample_data" "$SITE/onnx2tf/utils/common_functions.py" | head -5 || true
          # Generate a valid .npy with the expected shape and drop it in all
          # plausible locations so download_test_image_data() skips its
          # (broken) download and loads our file instead.
          python - << 'PYEOF'
          import numpy as np, os, site
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          targets = [
              name,  # current working directory
              os.path.join(site.getsitepackages()[0], "onnx2tf", name),
              os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name),
          ]
          for t in targets:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
              print("wrote", t)
          PYEOF

      - name: Download YuNet ONNX from OpenCV Zoo
        run: |
          curl -L -o face_detection_yunet_2023mar.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          echo "--- checksum ---"
          sha256sum face_detection_yunet_2023mar.onnx

      - name: Convert to TFLite (fixed 640x640)
        run: |
          onnx2tf -i face_detection_yunet_2023mar.onnx \
            -ois input:1,3,640,640 \
            -o yunet_saved_model
          ls -la yunet_saved_model/

      - name: Collect and rename output
        run: |
          # Name must match DetectionModelSpec.YUNET.filename in the app.
          cp yunet_saved_model/*_float32.tflite yunet_2023mar_float32.tflite
          echo "--- final TFLite ---"
          ls -la yunet_2023mar_float32.tflite
          sha256sum yunet_2023mar_float32.tflite > checksums.txt
          cat checksums.txt
          echo ""
          echo "::notice::Put this SHA-256 into ModelDownloader's YUNET entry (sha256)."

      - name: Create release with model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-free-v1
          name: "Model assets free-v1 (SFace + YuNet)"
          body: |
            YuNet face detection model converted from the official OpenCV Zoo
            ONNX (face_detection_yunet_2023mar.onnx) to TFLite with fixed
            640x640 input via onnx2tf.

            License: Apache-2.0 (weights included) — redistributable, and the
            F-Droid-friendly default detection model for Eidora. Shares the
            "models-free-v1" release with SFace.

            After publishing, update ModelDownloader's YUNET entry:
              - url points at this release's yunet_2023mar_float32.tflite
              - sha256 from checksums.txt below

            See checksums.txt for the TFLite SHA-256.
          files: |
            yunet_2023mar_float32.tflite
            checksums.txt
