name: Convert ArcFace to TFLite

# Downloads the ArcFace w600k_mbf ONNX (InsightFace weights, non-commercial
# license – private use only), converts it to TFLite with a fixed 112x112
# input via onnx2tf, and publishes it as release "models-v3".
on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install onnx2tf and dependencies
        run: |
          pip install --no-cache-dir \
            "tensorflow==2.17.0" \
            "tf_keras" \
            "onnx==1.16.1" \
            "onnxruntime==1.18.1" \
            "onnx2tf==1.26.3" \
            "onnx_graphsurgeon" \
            "sng4onnx" \
            "onnxsim==0.4.36" \
            "psutil" \
            "ml_dtypes" \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - << 'PYEOF'
          import numpy as np, os, site
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          targets = [
              name,
              os.path.join(site.getsitepackages()[0], "onnx2tf", name),
              os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name),
          ]
          for t in targets:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
              print("wrote", t)
          PYEOF

      - name: Download ArcFace w600k_mbf ONNX
        run: |
          curl -L -o w600k_mbf.onnx \
            https://github.com/yakhyo/face-reidentification/releases/latest/download/w600k_mbf.onnx
          ls -la w600k_mbf.onnx
          sha256sum w600k_mbf.onnx
          SIZE=$(stat -c%s w600k_mbf.onnx)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloaded file too small ($SIZE bytes). Aborting."
            head -c 300 w600k_mbf.onnx
            exit 1
          fi

      - name: Convert to TFLite (fixed 112x112)
        run: |
          onnx2tf -i w600k_mbf.onnx \
            -ois input.1:1,3,112,112 \
            -o arcface_saved_model || \
          onnx2tf -i w600k_mbf.onnx \
            -ois input:1,3,112,112 \
            -o arcface_saved_model
          ls -la arcface_saved_model/

      - name: Collect and rename output
        run: |
          cp arcface_saved_model/*_float32.tflite arcface_w600k_mbf_float32.tflite
          sha256sum arcface_w600k_mbf_float32.tflite > checksums.txt
          cat checksums.txt

      - name: Create release with model
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models-v3
          name: "Model assets v3 (ArcFace)"
          body: |
            ArcFace w600k_mbf (MobileFaceNet backbone) face embedding model
            converted from InsightFace ONNX weights to TFLite with fixed
            112x112 input via onnx2tf. Output: 512-dim embedding.

            NOTE: The InsightFace model weights are licensed for
            non-commercial research use only. Private use only –
            do not redistribute publicly.

            See checksums.txt for SHA-256.
          files: |
            arcface_w600k_mbf_float32.tflite
            checksums.txt
