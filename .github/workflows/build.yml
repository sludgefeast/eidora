name: Build APK

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'eidora_icon.svg'
      - 'eidora_notification_icon.svg'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests'
        type: boolean
        default: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint

      - name: Lint (ktlint)
        run: |
          ./ktlint \
            --reporter=plain \
            --reporter=checkstyle,output=build/ktlint-report.xml \
            "app/src/main/java/**/*.kt" \
            || true

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: build/ktlint-report.xml
          retention-days: 7

      - name: Run unit tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eidora-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
