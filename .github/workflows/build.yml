name: Build APK

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'eidora_icon.svg'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download SCRFD model from models-v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download models-v2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "scrfd_2.5g_kps_640_float32.tflite" \
            --dir app/src/main/assets \
            --clobber
          ls -la app/src/main/assets/

      - name: Download ArcFace model from models-v3 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download models-v3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "arcface_w600k_mbf_float32.tflite" \
            --dir app/src/main/assets \
            --clobber
          ls -la app/src/main/assets/

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eidora-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
