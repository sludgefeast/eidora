name: Build free model container

# Converts the two free models (YuNet detector + SFace embedder, both
# Apache-2.0 from the OpenCV Zoo) to TFLite, packs them together with the
# checked-in manifest into a single Eidora container (eidora-free.eidoramodel),
# and publishes it as a GitHub release. The container's SHA-256 is printed and
# attached — put it into the app's ContainerDownloader as the expected hash.
#
# Only free, redistributable models are built here. SCRFD/ArcFace are NOT
# packaged or hosted (non-commercial research licence); users build those
# themselves with scripts/convert_model.py + scripts/pack_container.py.
on:
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # needed to create the release
    steps:
      - name: Checkout (for manifest + pack script)
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install onnx2tf, packing deps
        run: |
          pip install \
            "tensorflow==2.17.0" tf_keras "onnx==1.16.1" \
            "onnxruntime==1.18.1" "onnx2tf==1.26.3" onnx_graphsurgeon \
            sng4onnx "onnxsim==0.4.36" psutil ml_dtypes pyyaml \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - <<'PY'
          import os, site
          import numpy as np
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          for t in [name,
                    os.path.join(site.getsitepackages()[0], "onnx2tf", name),
                    os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name)]:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
          print("calibration data written")
          PY

      # --- YuNet (detector) ---
      - name: Download YuNet ONNX (OpenCV Zoo, Apache-2.0)
        run: |
          curl -L -o yunet.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          sha256sum yunet.onnx

      - name: Convert YuNet to TFLite (640x640)
        run: |
          onnx2tf -i yunet.onnx -ois input:1,3,640,640 -o yunet_saved_model
          cp yunet_saved_model/*_float32.tflite yunet_2023mar_float32.tflite
          sha256sum yunet_2023mar_float32.tflite

      # --- SFace (embedder) ---
      - name: Download SFace ONNX (OpenCV / HuggingFace, Apache-2.0)
        run: |
          curl -L -o sface.onnx \
            https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec.onnx
          sha256sum sface.onnx

      - name: Resolve SFace input name
        run: |
          python - <<'PY'
          import onnx
          g = onnx.load("sface.onnx").graph
          open("sface_input.txt", "w").write(g.input[0].name)
          print("SFace input name:", g.input[0].name)
          PY

      - name: Convert SFace to TFLite (112x112)
        run: |
          NAME=$(cat sface_input.txt)
          onnx2tf -i sface.onnx -ois "${NAME}:1,3,112,112" -o sface_saved_model
          cp sface_saved_model/*_float32.tflite sface_opencv_float32.tflite
          sha256sum sface_opencv_float32.tflite

      # --- Pack the container ---
      - name: Assemble container folder
        run: |
          mkdir -p free-container
          cp docs/containers/free-models/manifest.yml free-container/
          cp yunet_2023mar_float32.tflite free-container/
          cp sface_opencv_float32.tflite free-container/
          echo "--- container folder ---"
          ls -la free-container/

      - name: Pack and validate container
        run: |
          # pack_container.py runs Class-1 + Class-2 (tensor) validation, so a
          # mismatch between manifest and tflite fails the build here.
          python scripts/pack_container.py \
            --dir free-container \
            --out eidora-free.eidoramodel
          echo "--- container SHA-256 (put this into ContainerDownloader) ---"
          sha256sum eidora-free.eidoramodel | tee container-sha256.txt
          echo "::notice::eidora-free.eidoramodel SHA-256 is in the job log and attached to the release."

      - name: Publish container release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: container-free-v1
          name: "Free model container (YuNet + SFace)"
          body: |
            Eidora free model container: YuNet detector + SFace embedder,
            both Apache-2.0 (OpenCV Zoo). Built by onnx2tf, packed and validated
            by scripts/pack_container.py.

            Put the SHA-256 below into the app's ContainerDownloader as the
            expected hash for the free container.
          files: |
            eidora-free.eidoramodel
            container-sha256.txt
