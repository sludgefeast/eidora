name: Build free model container

# Builds the free container (YuNet detector + SFace embedder, both Apache-2.0
# from the OpenCV Zoo) and publishes it as a GitHub release. The models and
# their build parameters (ONNX URL, input name, size) live in the checked-in
# manifest's `build:` blocks; this workflow just points the shared build script
# at that manifest.
#
# Same conversion core as the "bring your own model" workflow: both call
# scripts/build_container.py (→ convert_model.py → pack_container.py). The only
# difference is that this one builds the checked-in free manifest and publishes
# a release, whereas the generic one takes a user manifest and uploads an
# artifact.
#
# Only free, redistributable models are built here. SCRFD/ArcFace are NOT
# packaged or hosted (non-commercial research licence); users build those
# themselves via the generic workflow or the scripts.
on:
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # needed to create the release
    steps:
      - name: Checkout (for manifest + build scripts)
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install conversion + packing deps
        run: |
          pip install \
            "tensorflow==2.17.0" tf_keras "onnx==1.16.1" \
            "onnxruntime==1.18.1" "onnx2tf==1.26.3" onnx_graphsurgeon \
            sng4onnx "onnxsim==0.4.36" psutil ml_dtypes pyyaml \
            --extra-index-url https://pypi.ngc.nvidia.com

      - name: Provide calibration data (onnx2tf download workaround)
        run: |
          python - <<'PY'
          import os, site
          import numpy as np
          name = "calibration_image_sample_data_20x128x128x3_float32.npy"
          data = (np.random.rand(20, 128, 128, 3) * 255).astype(np.float32)
          for t in [name,
                    os.path.join(site.getsitepackages()[0], "onnx2tf", name),
                    os.path.join(site.getsitepackages()[0], "onnx2tf", "utils", name)]:
              os.makedirs(os.path.dirname(t) or ".", exist_ok=True)
              np.save(t, data)
          print("calibration data written")
          PY

      - name: Build container
        run: |
          python scripts/build_container.py \
            --manifest docs/containers/free-models/manifest.yml \
            --out eidora-free.eidoramodel
          echo "--- container SHA-256 (attached to the release as container-sha256.txt) ---"
          sha256sum eidora-free.eidoramodel | tee container-sha256.txt
          echo "::notice::eidora-free.eidoramodel SHA-256 is in the job log and attached to the release."

      - name: Read container version from manifest
        id: version
        run: |
          # The manifest is the single source of truth for the container version.
          # Read container.version (not the per-model version:) so the release tag
          # can't drift from what the app compares against for updates.
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('docs/containers/free-models/manifest.yml'))['container']['version'])")
          if ! echo "$VERSION" | grep -qE '^[0-9]+$'; then
            echo "::error::container.version in the manifest is not an integer: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing container-free-v$VERSION"

      - name: Ensure this version isn't already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to overwrite an existing release: if the tag is already there,
          # the manifest's container.version wasn't bumped. Bump it and re-run.
          TAG="container-free-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump container.version in the manifest before publishing."
            exit 1
          fi
          echo "::notice::$TAG is new — proceeding."

      - name: Publish container release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: container-free-v${{ steps.version.outputs.version }}
          name: "Free model container (YuNet + SFace) v${{ steps.version.outputs.version }}"
          body: |
            Eidora free model container: YuNet detector + SFace embedder,
            both Apache-2.0 (OpenCV Zoo). Built by scripts/build_container.py
            (onnx2tf + pack_container.py).

            The app verifies the download automatically against
            container-sha256.txt attached to this release — no hash needs to be
            entered anywhere.
          files: |
            eidora-free.eidoramodel
            container-sha256.txt
