name: Generate App Icons from SVG

# Renders the app icon SVG into the full Android mipmap PNG family.
# Only runs when eidora_icon.svg actually changes – the existing PNGs in the
# repo are the authoritative source when the SVG has not changed.
#
# Rendering uses CairoSVG (deterministic, no browser engine) with explicit
# sizes and no padding adjustment. If you need to tweak padding, edit the
# SVG viewBox/transform and let the action regenerate.
on:
  push:
    paths:
      - 'eidora_icon.svg'
      - 'eidora_notification_icon.svg'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + CairoSVG
        run: |
          sudo apt-get install -y libcairo2 libcairo2-dev
          pip install cairosvg pillow

      - name: Install svg2vectordrawable
        run: npm install -g svg2vectordrawable


      - name: Render mipmap PNGs
        run: |
          python - << 'PYEOF'
          import cairosvg
          from PIL import Image
          import io, os

          SVG = "eidora_icon.svg"

          # Standard Android launcher icon sizes
          SIZES = {
              "mipmap-mdpi":    48,
              "mipmap-hdpi":    72,
              "mipmap-xhdpi":   96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }

          # Adaptive icon foreground rendered at 1024 for maximum quality
          ADAPTIVE_SIZE = 1024

          # Android adaptive icon safe zone: the launcher masks to a circle/squircle
          # that covers the central 72dp of the 108dp canvas (66.7%).
          # To ensure nothing is clipped, we render the SVG at 66.7% of the canvas
          # size and paste it centred on a transparent background.
          SAFE_ZONE_RATIO = 72 / 108  # ≈ 0.667

          base = "app/src/main/res"

          def render_with_safe_zone(target_canvas_px):
              """Render SVG into safe zone, centred on a transparent canvas."""
              motif_px = round(target_canvas_px * SAFE_ZONE_RATIO)
              png_bytes = cairosvg.svg2png(
                  url=SVG,
                  output_width=motif_px,
                  output_height=motif_px,
              )
              motif = Image.open(io.BytesIO(png_bytes)).convert("RGBA")
              canvas = Image.new("RGBA", (target_canvas_px, target_canvas_px), (0, 0, 0, 0))
              offset = (target_canvas_px - motif_px) // 2
              canvas.paste(motif, (offset, offset), motif)
              return canvas

          # Launcher PNGs (square and round)
          for density, px in SIZES.items():
              img = render_with_safe_zone(px)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  dest = os.path.join(base, density, name)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  img.save(dest, "PNG")
                  print(f"wrote {dest} ({px}x{px})")

          # Adaptive foreground: SVG centred in safe zone on transparent canvas
          fg = render_with_safe_zone(ADAPTIVE_SIZE)
          fg.save(f"{base}/drawable/ic_launcher_foreground.png", "PNG")
          print(f"wrote adaptive foreground ({ADAPTIVE_SIZE}x{ADAPTIVE_SIZE})")

          # Adaptive background: solid colour matching the SVG background rect
          bg = Image.new("RGBA", (ADAPTIVE_SIZE, ADAPTIVE_SIZE), "#1A0A2E")
          bg.save(f"{base}/drawable/ic_launcher_background.png", "PNG")
          print(f"wrote adaptive background ({ADAPTIVE_SIZE}x{ADAPTIVE_SIZE})")

          print("Done.")
          PYEOF

      - name: Render notification icons
        run: |
          python - << 'PYEOF'
          import cairosvg
          from PIL import Image
          import io, os

          SVG = "eidora_notification_icon.svg"

          if not os.path.exists(SVG):
              print(f"Skipping notification icons: {SVG} not found in repo root")
              exit(0)

          # Android notification icon sizes (mdpi baseline = 24dp)
          SIZES = {
              "drawable-mdpi":    24,
              "drawable-hdpi":    36,
              "drawable-xhdpi":   48,
              "drawable-xxhdpi":  72,
              "drawable-xxxhdpi": 96,
          }

          base = "app/src/main/res"

          for density, px in SIZES.items():
              png_bytes = cairosvg.svg2png(
                  url=SVG,
                  output_width=px,
                  output_height=px,
              )
              img = Image.open(io.BytesIO(png_bytes)).convert("RGBA")
              dest = os.path.join(base, density, "ic_notification.png")
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              img.save(dest, "PNG")
              print(f"wrote {dest} ({px}x{px})")

          print("Notification icons done.")
          PYEOF

      - name: Render in-app vector drawable
        run: |
          # The SVG is authored to be conversion-friendly: no clip-path, no
          # opacity attribute (fill-opacity instead), all shapes as explicit
          # paths. svg2vectordrawable therefore reproduces it faithfully.
          mkdir -p app/src/main/res/drawable
          svg2vectordrawable -i eidora_icon.svg \
                             -o app/src/main/res/drawable/ic_eidora_logo.xml
          echo "--- generated vector drawable ---"
          cat app/src/main/res/drawable/ic_eidora_logo.xml
          # Fail loudly if the converter dropped shapes: the icon has 6 paths.
          count=$(grep -c "<path" app/src/main/res/drawable/ic_eidora_logo.xml)
          echo "path count: $count"
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected 6 paths in generated drawable, got $count - conversion dropped shapes"
            exit 1
          fi

      - name: Commit updated icons
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/mipmap-*/ic_launcher*.png
          git add app/src/main/res/drawable/ic_launcher_*.png
          git add app/src/main/res/drawable-*/ic_notification.png
          git add app/src/main/res/drawable/ic_eidora_logo.xml
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
          else
            git commit -m "chore: regenerate app icons from eidora_icon.svg"
            git push
          fi
