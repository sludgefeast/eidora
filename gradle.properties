org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# KSP + AGP 9 built-in Kotlin bridge.
# KSP registers its generated sources via the older kotlin.sourceSets DSL, which
# AGP 9's built-in Kotlin rejects ("Using kotlin.sourceSets DSL ... is not allowed
# with built-in Kotlin"). This is a known, still-open KSP issue for our Kotlin
# version (google/ksp#2729) — no KSP release for Kotlin 2.2.20 fixes it natively,
# so this Google-provided flag is the intended interim bridge, not a hack.
# Remove it once a KSP version that uses android.sourceSets is available and adopted.
android.disallowKotlinSourceSets=false
